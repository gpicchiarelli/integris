name: Defect report
description: Report a reproducible non-security defect or assurance gap.
title: "[Defect]: "
labels: [defect, triage]
body:
  - type: markdown
    attributes:
      value: Do not include secrets, real archive content, personal data, sensitive paths, or security vulnerabilities.
  - type: textarea
    id: outcome
    attributes:
      label: Observed outcome
      description: State what happened and why it is incorrect.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected outcome and acceptance criterion
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal safe reproduction
      description: Include revision, platform, filesystem, configuration digest, and sanitized steps.
    validations:
      required: true
  - type: dropdown
    id: criticality
    attributes:
      label: Suspected criticality
      options: [IC-1, IC-2, IC-3, IC-4, Unknown]
    validations:
      required: true
  - type: input
    id: trace
    attributes:
      label: Related requirement, hazard, threat, or verification IDs
  - type: checkboxes
    id: security
    attributes:
      label: Public-report safety
      options:
        - label: This report does not disclose a security vulnerability or sensitive data.
          required: true
