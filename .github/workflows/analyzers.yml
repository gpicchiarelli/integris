name: Static analyzers

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  staticcheck:
    name: staticcheck
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run staticcheck
        env:
          GOTOOLCHAIN: go1.26.5
          GOWORK: "off"
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 ./...

  gosec:
    name: gosec
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fail on high-confidence high-severity findings
        env:
          GOTOOLCHAIN: go1.26.5
          GOWORK: "off"
        run: >-
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          -quiet -severity high -confidence high ./...
      - name: Produce full SARIF report
        env:
          GOTOOLCHAIN: go1.26.5
          GOWORK: "off"
        run: >-
          go run github.com/securego/gosec/v2/cmd/gosec@v2.28.0
          -no-fail -fmt sarif -out gosec.sarif ./...
      - name: Upload gosec SARIF
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: gosec-sarif
          path: gosec.sarif
          if-no-files-found: error
          retention-days: 14
