name: Evidence

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  campaigns:
    name: Regenerate evidence campaigns
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run evidence producer
        env:
          # Fuzz campaigns run in fuzz.yml / CI short-fuzz; keep evidence gate deterministic.
          INTEGRIS_EVIDENCE_SKIP_FUZZ: "1"
        run: make evidence
      - name: Run release digest
        run: make release-digest
      - name: Upload produced evidence tree
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: evidence-tree
          path: evidence/
          if-no-files-found: error
          retention-days: 30

  assurance-json:
    name: Validate assurance JSON
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Assure + trace check
        run: |
          make assure
          make trace-check
      - name: JSON syntax check
        run: |
          set -euo pipefail
          for f in assurance/*.json evidence/**/*.json; do
            [ -f "$f" ] || continue
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
            echo "ok $f"
          done
