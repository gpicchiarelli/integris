name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify assurance baseline
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Verify repository
        run: make verify
      - name: Race-test assurance tooling
        run: go test -race ./...
      - name: Scan reachable Go vulnerabilities
        env:
          GOTOOLCHAIN: go1.26.5
          GOWORK: "off"
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...

  cross-platform:
    name: Bootstrap test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-24.04]
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Test
        run: go test ./...

  fuzz-kernels:
    name: Short fuzz (${{ matrix.fuzz }})
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/path
            fuzz: FuzzPathComponent
          - package: ./internal/path
            fuzz: FuzzPathSequence
          - package: ./internal/codec
            fuzz: FuzzDecodeRecord
          - package: ./internal/journal
            fuzz: FuzzReadPrefix
          - package: ./internal/protocol
            fuzz: FuzzDecode
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Short-fuzz M1 kernel target
        run: go test -fuzz=${{ matrix.fuzz }} -fuzztime=30s ${{ matrix.package }}
