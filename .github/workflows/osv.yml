name: OSV Scanner

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  schedule:
    - cron: "11 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  scan:
    name: Scan Go modules
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Run OSV-Scanner
        env:
          GOTOOLCHAIN: go1.26.5
          GOWORK: "off"
        run: |
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0 \
            --config=osv-scanner.toml \
            --format sarif \
            --output-file osv.sarif \
            --lockfile=go.mod
          go run github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.4.0 \
            --config=osv-scanner.toml \
            --format table \
            --lockfile=go.mod
      - name: Upload OSV SARIF artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: osv-sarif
          path: osv.sarif
          if-no-files-found: warn
          retention-days: 14
      - name: Upload to code scanning
        if: github.event.repository.private == false && hashFiles('osv.sarif') != ''
        uses: github/codeql-action/upload-sarif@f205ea1c3313d32999d8d6a48b4f6530d4437b38 # v4.37.4
        with:
          sarif_file: osv.sarif
          category: osv-scanner
