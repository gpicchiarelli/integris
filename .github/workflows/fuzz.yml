name: Scheduled fuzzing

on:
  schedule:
    - cron: "17 3 * * 2"
  workflow_dispatch:
  # Optional long fuzz on demand from merge queue / release prep.
  workflow_call:

permissions:
  contents: read

jobs:
  assurance-inputs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz hostile JSON inputs
        run: go test -fuzz=FuzzRejectDuplicateKeys -fuzztime=5m ./cmd/integris-assure

  m1-kernels:
    name: Fuzz ${{ matrix.fuzz }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - package: ./internal/path
            fuzz: FuzzPathComponent
          - package: ./internal/path
            fuzz: FuzzPathSequence
          - package: ./internal/codec
            fuzz: FuzzDecodeRecord
          - package: ./internal/journal
            fuzz: FuzzReadPrefix
          - package: ./internal/protocol
            fuzz: FuzzDecode
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Fuzz M1 kernel target
        run: go test -fuzz=${{ matrix.fuzz }} -fuzztime=5m ${{ matrix.package }}
