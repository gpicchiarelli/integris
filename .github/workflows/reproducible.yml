name: Reproducible builds

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  attestations: write

concurrency:
  group: reproducible-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-a:
    name: Build pass A
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Deterministic build
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          SOURCE_DATE_EPOCH: "0"
          TZ: UTC
          LANG: C
          LC_ALL: C
        run: |
          mkdir -p dist
          for pkg in assure evidence release-digest verify-config role-stub; do
            go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" \
              -o "dist/integris-${pkg}" "./cmd/integris-${pkg}"
          done
          (cd dist && sha256sum * | sort | tee ../digests-a.txt)
      - name: Upload digests A
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-a
          path: digests-a.txt
          if-no-files-found: error
          retention-days: 14
      - name: Upload binaries A
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: binaries-a
          path: dist/
          if-no-files-found: error
          retention-days: 14

  build-b:
    name: Build pass B
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go toolchain
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Deterministic build (independent runner)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
          SOURCE_DATE_EPOCH: "0"
          TZ: UTC
          LANG: C
          LC_ALL: C
        run: |
          mkdir -p dist
          for pkg in assure evidence release-digest verify-config role-stub; do
            go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" \
              -o "dist/integris-${pkg}" "./cmd/integris-${pkg}"
          done
          (cd dist && sha256sum * | sort | tee ../digests-b.txt)
      - name: Upload digests B
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-b
          path: digests-b.txt
          if-no-files-found: error
          retention-days: 14

  compare:
    name: Compare digests
    needs: [build-a, build-b]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Download digests A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-a
          path: a
      - name: Download digests B
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: digests-b
          path: b
      - name: Require bit-identical digests
        run: |
          echo "=== digests A ===" && cat a/digests-a.txt
          echo "=== digests B ===" && cat b/digests-b.txt
          diff -u a/digests-a.txt b/digests-b.txt
      - name: Download binaries A
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: binaries-a
          path: dist
      - name: Attest build provenance
        if: github.event_name != 'pull_request'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: dist/*
